# Publishes the SP1 execution harness as a container image.
#
# SP1 ships no image that executes an arbitrary ELF - ghcr.io/succinctlabs/sp1
# is the toolchain for BUILDING guests - so anything that wants to RUN a bflat
# guest has to compile a harness from the SDK, roughly fifteen minutes a go.
# This publishes it once.
#
# The tag is the SP1 release, and it must match SP1_REF in build-release.yml:
# the guest's syscall ids and public-values protocol come from the same SDK, so
# a runner on a different tag would be testing a different contract.
#
# Published to GHCR, not Docker Hub: this repository has no Docker Hub
# credentials (only NUGET_USER), and GHCR takes the workflow's own GITHUB_TOKEN,
# so publishing needs nothing provisioned. The package inherits the repository's
# visibility on first push - if the repo is private, flip the package to public
# once under Packages -> sp1-runner -> Package settings, or consumers cannot
# pull it.
#
# Manual only. After publishing, pin the new digest in the consumers
# (nethermind's Nethermind.Stateless.Sp1Guest/Makefile, SP1_IMAGE).
name: Release SP1 runner

on:
  workflow_dispatch:
    inputs:
      sp1_ref:
        description: SP1 release to build the harness against (tag = image tag)
        type: string
        default: v6.5.0
      push:
        description: Push to GHCR (off = build only, to check it compiles)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  runner:
    name: sp1-runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pin the SDK to the requested release
        working-directory: runner
        run: |
          set -euo pipefail
          sed -i "s|tag = \"[^\"]*\"|tag = \"${{ inputs.sp1_ref }}\"|" Cargo.toml
          grep 'sp1-sdk' Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: runner
          push: ${{ inputs.push }}
          tags: ghcr.io/nethermindeth/sp1-runner:${{ inputs.sp1_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        if: inputs.push
        run: |
          echo "### Pin this in the consumers" >> "$GITHUB_STEP_SUMMARY"
          echo '```make' >> "$GITHUB_STEP_SUMMARY"
          echo "SP1_IMAGE ?= ghcr.io/nethermindeth/sp1-runner:${{ inputs.sp1_ref }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
